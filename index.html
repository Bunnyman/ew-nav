<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подавлення по навігації</title>
<style>
  :root {
    --bg: #0f1216;
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.5);
    --circle-off: #4cc38a;
    --minus-off: #0a5c39;
    --circle-on: #e5484d;
    --plus-on: #9f1d22;
    /* Largest circle that still fits three in a row plus title and labels */
    --gap: min(4vw, 48px);
    --size: min(calc((100vw - 48px - 2 * var(--gap)) / 3), 55vh);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: min(6vh, 48px);
    padding: 24px;
  }

  h1 {
    font-size: clamp(1.25rem, 3vw, 2rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    text-align: center;
  }

  .buttons {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    gap: var(--gap);
  }

  .nav-button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: min(2.5vh, 20px);
    background: none;
    border: none;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }

  .circle {
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background: var(--circle-off);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .nav-button:active .circle {
    transform: scale(0.95);
  }

  .sign {
    display: none;
  }

  .sign svg {
    display: block;
    width: calc(var(--size) * 0.45);
    height: calc(var(--size) * 0.45);
  }

  .minus {
    color: var(--minus-off);
  }

  .plus {
    color: var(--plus-on);
  }

  /* Inactive state: light green circle with a darker-green minus sign */
  .nav-button .minus {
    display: block;
  }

  /* Active state: red circle with a darker-red plus sign */
  .nav-button.active .circle {
    background: var(--circle-on);
  }

  .nav-button.active .minus {
    display: none;
  }

  .nav-button.active .plus {
    display: block;
  }

  .label {
    font-size: clamp(1.7rem, 3.74vw, 2.72rem);
    font-weight: 500;
    color: var(--text-dim);
    transition: color 0.2s ease;
  }

  .nav-button.active .label {
    color: var(--text);
  }

</style>
</head>
<body>
  <main class="container">
    <h1>Подавлення по навігації</h1>
    <div class="buttons">
      <button type="button" class="nav-button" data-zone="north">
        <span class="circle">
          <span class="sign plus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </span>
          <span class="sign minus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </span>
        </span>
        <span class="label">Північ</span>
      </button>
      <button type="button" class="nav-button" data-zone="south">
        <span class="circle">
          <span class="sign plus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </span>
          <span class="sign minus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </span>
        </span>
        <span class="label">Південь</span>
      </button>
      <button type="button" class="nav-button" data-zone="kharkiv">
        <span class="circle">
          <span class="sign plus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </span>
          <span class="sign minus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </span>
        </span>
        <span class="label">Харків</span>
      </button>
    </div>
  </main>

  <script>
    document.querySelectorAll('.nav-button').forEach(function (button) {
      button.addEventListener('click', function () {
        button.classList.toggle('active');
      });
    });
  </script>
</body>
</html>
